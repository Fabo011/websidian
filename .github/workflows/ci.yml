# Quality gate for development work.
#
# Runs on every push to `dev` and every pull request targeting `main` or
# `dev`: install, lint, build, full Jest suite. A red run means the change
# broke something — nothing should be merged to `main` (which triggers the
# release pipeline) until this is green.
#
# The release pipeline (release.yml) runs the same tests again on `main` as
# the final gate before tagging and publishing the Docker image.

name: ci

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Node 24 to match engines.node and the lockfile (see AGENTS.md).
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # Quality gate: fail the build when any dependency has a CRITICAL
      # vulnerability. Lower severities are reported by npm but do not block.
      - name: Audit dependencies (block on critical)
        run: npm audit --audit-level=critical

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build client + server
        run: npm run build:all

      - name: Run tests (quality gate)
        run: npm test
