# GitHub Actions pipeline.
#
# On every push to `main` this will:
#   1. Run the quality gate by calling the reusable ci.yml workflow
#      (install, npm audit on critical, lint, build, full test suite).
#   2. Derive the next version from the latest existing `v*` git tag, bumped
#      by the merged PR's title: MAJOR -> major, FEATURE -> minor,
#      FIX -> patch (also the fallback when none of the keywords is present).
#      package.json is left untouched — git tags are the version source of
#      truth. Then create and push the new tag.
#   3. Build a multi-arch Docker image (linux/amd64 + linux/arm64) so it runs on
#      x86_64 servers (e.g. Ubuntu 26.04 x86_64) as well as ARM (Raspberry Pi)
#      and push it to the GitHub Container Registry (ghcr.io).
#
# Requirements:
#   - No extra secrets are needed. The built-in GITHUB_TOKEN is used to push the
#     git tag and to log in / push to ghcr.io. Make sure that under
#     Repo > Settings > Actions > General > "Workflow permissions" the option
#     "Read and write permissions" is enabled.

name: build-and-release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Image repository: ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Quality gate: reuses the ci.yml workflow (install, audit on critical
  # vulnerabilities, lint, build, tests). The release job below only runs
  # when it passes — a failing gate blocks the tag + Docker image.
  quality-gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Find the PR that was merged into this commit and read its title. A
      # direct push to main has no PR -> empty title -> patch fallback.
      - name: Determine version bump from PR title
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].title // ""' 2>/dev/null || echo "")
          echo "PR title: ${TITLE:-<none>}"
          case "$TITLE" in
            *MAJOR*)   BUMP=major ;;
            *FEATURE*) BUMP=minor ;;
            *FIX*)     BUMP=patch ;;
            *)         BUMP=patch ;;  # fallback: treat as a fix
          esac
          echo "Version bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # Next version = latest v* tag bumped by the keyword. package.json is
      # not touched. Older tags may carry a `-<date>.<sha>` suffix; only the
      # semver core before the dash counts. No tag at all seeds from
      # package.json so the numbering continues instead of restarting.
      - name: Derive version tag from latest tag
        id: version
        run: |
          LATEST=$(git tag --list 'v*' | sed 's/^v//; s/-.*$//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST=$(node -p "require('./package.json').version")
            echo "No existing v* tag; seeding from package.json: ${LATEST}"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "${{ steps.bump.outputs.bump }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            *)     VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          TAG="v${VERSION}"
          echo "Latest: v${LATEST} -> next: ${TAG} (${{ steps.bump.outputs.bump }})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Automated release $TAG"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TAG"
          fi

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}
          provenance: false
