# Info: This docker-stack.yaml mirroring the current deployed stack on the websidian servers.
networks:
  websidian-net:
    driver: overlay
    attachable: true
    # INFRA-1: encrypt the overlay data plane (IPSec/ESP) so cross-node service
    # traffic — including the app<->postgres link between separate servers — is
    # not sent in cleartext over the underlay network. Note: changing this
    # requires the network to be recreated (see security todo.md).
    driver_opts:
      encrypted: "true"

volumes:
  postgres-data:
    external: true
    name: server_postgres-data

# INFRA-3: secrets are provided as Docker secrets (encrypted at rest in Swarm's
# Raft store, mounted read-only at /run/secrets/<name>, never exposed via
# `docker inspect` or the process env). Create them once on the manager before
# deploying (see security todo.md). Marked external so the stack references
# operator-managed secrets rather than defining their values here.
secrets:
  jwt_secret:
    external: true
  encryption_key:
    external: true
  db_password:
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    networks:
      - websidian-net
    deploy:
      mode: global
      restart_policy:
        condition: any

  websidian:
    image: ghcr.io/fabo011/websidian:latest
    networks:
      - websidian-net
    ports:
      - target: 3065
        published: 3065
        protocol: tcp
        mode: host
    secrets:
      - jwt_secret
      - encryption_key
      - db_password
    environment:
      USER_STORAGE_ENABLED: "${USER_STORAGE_ENABLED}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION}"
      MAX_REGISTRATIONS: "${MAX_REGISTRATIONS}"
      PORT: 3065
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED}"
      # ENCRYPTION_KEY provided via Docker secret (read from *_FILE).
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      # JWT_SECRET provided via Docker secret (read from *_FILE).
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_URL: "${APP_URL}"
      CONTACT_EMAIL: "${CONTACT_EMAIL}"
      DONATION_LINK: "${DONATION_LINK}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      DB_TYPE: "${DB_TYPE}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_USERNAME: "${DB_USERNAME}"
      # DB_PASSWORD provided via Docker secret (read from *_FILE).
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_DATABASE: "${DB_DATABASE}"
      DB_SSL: "${DB_SSL}"
      TRASH_RETENTION_DAYS: "${TRASH_RETENTION_DAYS}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX}"
      VAULT_TREE_CACHE_SECONDS: "${VAULT_TREE_CACHE_SECONDS}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB}"
      IMPRINT: "${IMPRINT}"
      MAX_UPLOAD_FILE_MB: "${MAX_UPLOAD_FILE_MB}"
      MAX_IMPORT_FILES: "${MAX_IMPORT_FILES}"
      MAX_IMPORT_TOTAL_MB: "${MAX_IMPORT_TOTAL_MB}"
      UPLOAD_REQUEST_TIMEOUT_MIN: "${UPLOAD_REQUEST_TIMEOUT_MIN}"
      SEARCH_CACHE_TTL_MS: "${SEARCH_CACHE_TTL_MS}"
      RATE_LIMIT_DASH_ENABLED: "${RATE_LIMIT_DASH_ENABLED}"
      RATE_LIMIT_DASH_WINDOW_SECONDS: "${RATE_LIMIT_DASH_WINDOW_SECONDS}"
      RATE_LIMIT_DASH_MAX: "${RATE_LIMIT_DASH_MAX}"
      UPLOAD_EXCLUDE_PATTERNS: "${UPLOAD_EXCLUDE_PATTERNS}"
      MAX_OPEN_TABS: "${MAX_OPEN_TABS}"
      # End-to-end encrypted chat. NOTE: the WebSocket relay keeps its live
      # socket registry in-process, so real-time delivery assumes a single app
      # instance. With replicas > 1 (below) peers on different replicas fall back
      # to the offline queue (delivered on reconnect); use CHAT_ENABLED=false or
      # run a single replica / sticky routing for instant cross-user delivery.
      CHAT_ENABLED: "${CHAT_ENABLED:-true}"
      CHAT_PENDING_TTL_DAYS: "${CHAT_PENDING_TTL_DAYS:-30}"
    deploy:
      mode: global
      endpoint_mode: dnsrr
      restart_policy:
        condition: any

  postgres:
    image: postgres:18-alpine
    command: postgres -c unix_socket_directories=''
    networks:
      - websidian-net
    secrets:
      - db_password
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      # INFRA-3: password from the same Docker secret the app reads.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      replicas: 1          # NEVER more than 1 without real replication (Patroni etc.)
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
