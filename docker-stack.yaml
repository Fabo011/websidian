networks:
  websidian-net:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
    external: true
    name: server_postgres-data

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    networks:
      - websidian-net
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  websidian:
    image: ghcr.io/fabo011/websidian:latest
    networks:
      - websidian-net
    ports:
      - target: 3065
        published: 3065
        protocol: tcp
        mode: host
    environment:
      USER_STORAGE_ENABLED: "true"
      # Managed storage: with USER_STORAGE_ENABLED=true and STORAGE_DRIVER=s3,
      # this app-hosted S3 bucket is offered to users as "managed" storage
      # (billed + quota-limited). Users may still bring their own S3/WebDAV.
      STORAGE_DRIVER: "${STORAGE_DRIVER:-s3}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      S3_PREFIX: "${S3_PREFIX}"
      # Quota + billing for managed users. Free = STORAGE_QUOTA_GB (e.g. 0.125 =
      # 125 MB); paid upgrade tops out at STORAGE_PLUS_GB.
      STORAGE_QUOTA_GB: "${STORAGE_QUOTA_GB:-0.125}"
      STORAGE_PLUS_GB: "${STORAGE_PLUS_GB:-3}"
      PRICE_PLUS: "${PRICE_PLUS}"
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_PRICE_PLUS: "${STRIPE_PRICE_PLUS}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      PORT: 3065
      ENCRYPTION_ENABLED: "${ENCRYPTION_ENABLED:-true}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      JWT_SECRET: "${JWT_SECRET}"
      APP_URL: "${APP_URL}"
      CONTACT_EMAIL: "${CONTACT_EMAIL}"
      DONATION_LINK: "${DONATION_LINK}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      DB_TYPE: "${DB_TYPE:-postgres}"
      DB_HOST: "${DB_HOST:-localhost}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_DATABASE: "${DB_DATABASE:-web_obsidian}"
      DB_SSL: "${DB_SSL:-false}"
      TRASH_RETENTION_DAYS: "${TRASH_RETENTION_DAYS}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX}"
      VAULT_TREE_CACHE_SECONDS: "${VAULT_TREE_CACHE_SECONDS}"
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB}"
      IMPRINT: "${IMPRINT:-true}"
      MAX_UPLOAD_FILE_MB: "${MAX_UPLOAD_FILE_MB:-200}"
      MAX_IMPORT_FILES: "${MAX_IMPORT_FILES:-20000}"
      MAX_IMPORT_TOTAL_MB: "${MAX_IMPORT_TOTAL_MB:-200}"
      UPLOAD_REQUEST_TIMEOUT_MIN: "${UPLOAD_REQUEST_TIMEOUT_MIN:-15}"
      SEARCH_CACHE_TTL_MS: "${SEARCH_CACHE_TTL_MS:-15000}"
      RATE_LIMIT_DASH_ENABLED: "${RATE_LIMIT_DASH_ENABLED:-true}"
      RATE_LIMIT_DASH_WINDOW_SECONDS: "${RATE_LIMIT_DASH_WINDOW_SECONDS:-60}"
      RATE_LIMIT_DASH_MAX: "${RATE_LIMIT_DASH_MAX:-50000000}"
      UPLOAD_EXCLUDE_PATTERNS: "${UPLOAD_EXCLUDE_PATTERNS}"
      MAX_OPEN_TABS: "${MAX_OPEN_TABS:-8}"
    deploy:
      replicas: 2
      endpoint_mode: dnsrr
      labels:
        shepherd.enable: "true"
      restart_policy:
        condition: any

  shepherd:
    image: containrrr/shepherd:latest
    environment:
      SLEEP_TIME: "5m"
      WITH_REGISTRY_AUTH: "true"
      IMAGE_AUTOCLEAN_LIMIT: "3"
      FILTER_SERVICES: "label=shepherd.enable=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - websidian-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  postgres:
    image: postgres:18-alpine
    command: postgres -c unix_socket_directories=''
    networks:
      - websidian-net
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any